apiVersion: v1
kind: Namespace
metadata:
  name: pulsar
---
# Oxia StatefulSet, Standalone
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oxia
  namespace: pulsar
spec:
  serviceName: oxia
  replicas: 1
  selector:
    matchLabels:
      app: pulsar
      component: oxia
  template:
    metadata:
      labels:
        app: pulsar
        component: oxia
    spec:
      containers:
        - name: oxia-standalone
          image: ascentstream/oxia:latest
          imagePullPolicy: IfNotPresent
          command: [ "oxia", "standalone" ]
          args:
            - "--wal-dir=/data/oxia"
            - "--data-dir=/data/oxia"
          ports:
            - containerPort: 6648
              name: oxia
          volumeMounts:
            - name: oxia-data
              mountPath: /data/oxia
  # 移除 hostPath，只用 PVC
  volumeClaimTemplates:
    - metadata:
        name: oxia-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi
---
# 还需要一个 Service 来暴露端口
apiVersion: v1
kind: Service
metadata:
  name: oxia
  namespace: pulsar
spec:
  selector:
    app: pulsar
    component: oxia
  ports:
    - port: 6648
      targetPort: oxia